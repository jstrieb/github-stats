name: Generate Stats Images

on:
  push:
    branches: 
      - master
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

    - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2 tag
      with:
        version: 0.16.0

    - name: Build
      run: |
        zig build

    # Read-only tokens for organizations that installed the stats GitHub App.
    # Runs before switching branches because the script lives on this branch.
    - name: Mint organization tokens
      if: ${{ vars.STATS_APP_CLIENT_ID != '' }}
      run: |
        .github/scripts/org-installation-tokens.sh "$RUNNER_TEMP/org-tokens"
      env:
        STATS_APP_CLIENT_ID: ${{ vars.STATS_APP_CLIENT_ID }}
        STATS_APP_PRIVATE_KEY: ${{ secrets.STATS_APP_PRIVATE_KEY }}
        STATS_APP_ORGS: ${{ secrets.STATS_APP_ORGS || vars.STATS_APP_ORGS }}

    - name: Checkout history branch
      run: |
        git config --global user.name "jstrieb/github-stats"
        git config --global user.email "github-stats[bot]@jstrieb.github.io"
        # Push generated files to the generated branch
        git pull
        git checkout generated || git checkout -b generated

    # Cache to preserve progress across runs
    - name: Cache repository stats
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
      with:
        path: generated/repo_stats_cache.json
        key: repo-stats-cache-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          repo-stats-cache-${{ github.sha }}-
          repo-stats-cache-

    - name: Generate images
      run: |
        if [[ -f "$RUNNER_TEMP/org-tokens" ]]; then
          ORG_ACCESS_TOKENS="$(<"$RUNNER_TEMP/org-tokens")"
          export ORG_ACCESS_TOKENS
          rm "$RUNNER_TEMP/org-tokens"
        fi
        ./zig-out/bin/github-stats
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        EXCLUDE_REPOS: ${{ secrets.EXCLUDE_REPOS || vars.EXCLUDE_REPOS || vars.EXCLUDED }}
        EXCLUDE_LANGS: ${{ secrets.EXCLUDE_LANGS || vars.EXCLUDE_LANGS || vars.EXCLUDED_LANGS }}
        EXCLUDE_FORKED_REPOS: ${{ vars.EXCLUDE_FORKED_REPOS || 'false' }}
        OWNED_ONLY_STARS_FORKS: ${{ vars.OWNED_ONLY_STARS_FORKS || 'false' }}
        EXCLUDE_PRIVATE: "false"
        SILENT: "true"
        MAX_RUNTIME_SECONDS: ${{ vars.GITHUB_STATS_MAX_RUNTIME_SECONDS || '720' }}
        REPO_STATS_CACHE_FILE: generated/repo_stats_cache.json
        # TODO: Remove this when they get their API working again
        # https://github.com/orgs/community/discussions/192970
        MAX_RETRIES: 5

    - name: Commit to the repo
      run: |
        git add overview.svg languages.svg
        # Force the build to succeed, even if no files were changed
        git commit -m 'Update generated files' || true
        git push --set-upstream origin generated
